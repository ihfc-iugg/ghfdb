name: Prepare Release

# Opens the release pull request: bumps the version in pyproject.toml and uv.lock
# and opens a CHANGELOG section for it. Merging that pull request is the release
# decision. Tag Release then creates the tag and the GitHub release, and Publish
# uploads the package to PyPI.
#
# RELEASE_TOKEN is a personal access token (Contents and Pull requests, read and
# write). A pull request opened with GITHUB_TOKEN runs no checks, so it could
# never merge.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (patch, minor or major) or an explicit version such as 0.1.0
        type: string
        required: true
        default: patch

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    uses: django-mvp/shared/.github/workflows/prepare-release.yml@v0.6.0
    with:
      bump: ${{ inputs.bump }}
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
