name: Publish

# Publishes the package to PyPI when a GitHub release tagged v<major>.<minor>.<patch>
# is published. PyPI authenticates the run through trusted publishing, so no token
# is stored in the repository. The release version is the one in pyproject.toml,
# and the tag must match it.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build the package
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(uv version --short)"
          if [ "$TAG" != "v$version" ]; then
            echo "Release tag $TAG does not match the package version $version"
            exit 1
          fi
      - name: Test
        run: uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ghfdb/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
