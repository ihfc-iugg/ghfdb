[project]
name = "ghfdb"
version = "0.1.0"
description = "Python tools for working with the Global Heat Flow Database."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Sam Jennings", email = "samuel.scott.jennings@gmail.com" }]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "fastexcel>=0.21",
  "frictionless>=5",
  "jinja2>=3.1",
  "markupsafe>=3",
  "numpy>=2",
  "openpyxl>=3.1",
  "pandas[pyarrow]>=3.0",
  "platformdirs>=4",
  "rdflib>=7",
  "requests>=2.32",
  "requests-cache>=1.2",
]

[project.scripts]
ghfdb = "ghfdb.cli:run"

[project.urls]
Repository = "https://github.com/ihfc-iugg/ghfdb"
Issues = "https://github.com/ihfc-iugg/ghfdb/issues"
Changelog = "https://github.com/ihfc-iugg/ghfdb/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "pre-commit>=4",
  "deptry>=0.23",
  "mypy>=1.15",
  "pandas-stubs",
  "types-openpyxl",
  "types-requests",
  "responses>=0.25",
  "xlsxwriter>=3.2",
]
docs = ["sphinx>=8", "myst-parser>=4", "furo>=2025.1", "sphinxcontrib-mermaid>=1", "validators>=0.34"]

[tool.uv]
default-groups = ["dev", "docs"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ghfdb"]

# Without an explicit list, hatchling puts the whole working tree in the sdist.
[tool.hatch.build.targets.sdist]
include = ["/ghfdb", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["docs", "tests"]
addopts = "--import-mode=importlib"
markers = ["slow: takes seconds, not milliseconds; runs by default"]

[tool.mypy]
strict = true
files = ["ghfdb", "tests", "docs"]

# XlsxWriter ships no type hints and no stubs package exists.
[[tool.mypy.overrides]]
module = "xlsxwriter.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.deptry]
known_first_party = ["ghfdb"]

[tool.forge.conformance]
# The worked examples are a data file, ghfdb/qc/worked_examples.json, so their test has no
# Python module to mirror.
non-mirror-paths = ["tests/test_qc/test_worked_examples.py"]
