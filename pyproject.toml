[project]
name = "ghfdb"
version = "0.0.1"
description = "Python tools for working with the Global Heat Flow Database."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Sam Jennings", email = "samuel.scott.jennings@gmail.com" }]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = ["openpyxl>=3.1", "rdflib>=7"]

[project.urls]
Repository = "https://github.com/ihfc-iugg/ghfdb"
Issues = "https://github.com/ihfc-iugg/ghfdb/issues"
Changelog = "https://github.com/ihfc-iugg/ghfdb/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "pre-commit>=4",
  "deptry>=0.23",
  "mypy>=1.15",
  "frictionless>=5",
  "types-openpyxl",
]
docs = ["sphinx>=8", "myst-parser>=4", "furo>=2025.1", "sphinxcontrib-mermaid>=1"]

[tool.uv]
default-groups = ["dev", "docs"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ghfdb"]

# Without an explicit list, hatchling puts the whole working tree in the sdist.
[tool.hatch.build.targets.sdist]
include = ["/ghfdb", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["docs"]
addopts = "--import-mode=importlib"

[tool.mypy]
strict = true
files = ["ghfdb", "tests", "docs"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.deptry]
known_first_party = ["ghfdb"]
